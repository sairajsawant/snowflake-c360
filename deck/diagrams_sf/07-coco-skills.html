<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><title>CoCo CLI skills</title></head>
<body>
<svg width="1380" height="630" viewBox="0 0 1380 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#252525"/></marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#29B5E8"/></marker>
  </defs>

  <text class="cap" x="40"  y="40">Input</text>
  <text class="cap" x="330" y="40">Processing</text>
  <text class="cap" x="990" y="40">Output</text>

  <!-- input -->
  <rect class="t-kraft" x="40" y="236" width="250" height="132" rx="16"/>
  <text class="serif" x="62" y="282" style="font-size:22px;font-style:italic">“What should we</text>
  <text class="serif" x="62" y="312" style="font-size:22px;font-style:italic">do about</text>
  <text class="serif" x="62" y="342" style="font-size:22px;font-style:italic">Suresh Reddy?”</text>
  <path class="arrow" d="M294,302 L334,302"/>

  <!-- coco -->
  <rect x="340" y="222" width="200" height="160" rx="16" fill="#252525"/>
  <text class="h2" x="362" y="278" style="fill:#FFFFFF">CoCo CLI</text>
  <text class="sm" x="362" y="312" style="fill:#C9D3DC">picks the right</text>
  <text class="sm" x="362" y="336" style="fill:#C9D3DC">skill and runs it</text>

  <!-- skills -->
  <rect class="t-sky"     x="600" y="60"  width="330" height="100" rx="12"/>
  <text class="lbl" x="622" y="100" style="font-weight:600">Customer Query</text>
  <text class="sm"  x="622" y="130">routes a question to one engine</text>
  <rect class="t-olive"   x="600" y="190" width="330" height="100" rx="12"/>
  <text class="lbl" x="622" y="230" style="font-weight:600">Signal Onboarding</text>
  <text class="sm"  x="622" y="260">discover, review, add signals</text>
  <rect class="t-clay"    x="600" y="320" width="330" height="100" rx="12"/>
  <text class="lbl" x="622" y="360" style="font-weight:600">Decision Domain</text>
  <text class="sm"  x="622" y="390">add a use case as configuration</text>
  <rect class="t-heather" x="600" y="450" width="330" height="100" rx="12"/>
  <text class="lbl" x="622" y="490" style="font-weight:600">Decision Audit</text>
  <text class="sm"  x="622" y="520">prove answers are repeatable</text>

  <path class="arrow-c" d="M544,280 C570,280 570,110 594,110" style="stroke-width:2.6"/>
  <path class="arrow" d="M544,296 C572,296 572,240 594,240"/>
  <path class="arrow" d="M544,312 C572,312 572,370 594,370"/>
  <path class="arrow" d="M544,328 C570,328 570,500 594,500"/>

  <!-- platform -->
  <rect class="panel" x="990" y="60" width="350" height="490" rx="14" style="stroke:#252525"/>
  <text class="cap" x="1012" y="92">On Snowflake</text>
  <rect class="box" x="1012" y="110" width="306" height="44" rx="8"/><text class="lbl" x="1028" y="139">Grounded answer + evidence</text>
  <rect class="box" x="1012" y="240" width="306" height="44" rx="8"/><text class="lbl" x="1028" y="269">New signal, live for all</text>
  <rect class="box" x="1012" y="370" width="306" height="44" rx="8"/><text class="lbl" x="1028" y="399">New decision engine</text>
  <rect class="box" x="1012" y="500" width="306" height="44" rx="8" style="display:none"/>
  <rect class="box" x="1012" y="482" width="306" height="44" rx="8"/><text class="lbl" x="1028" y="511">Audit report</text>
  <path class="arrow-c" d="M934,110 L1006,132" style="stroke-width:2.6"/>
  <path class="arrow" d="M934,240 L1006,262"/>
  <path class="arrow" d="M934,370 L1006,392"/>
  <path class="arrow" d="M934,500 L1006,504"/>

  <text class="sm" x="40" y="580" style="fill:#11567F">Highlighted: the path shown in the demo</text>
  <text class="sm" x="990" y="584" style="fill:#11567F">Published to a Snowflake stage</text>
</svg>
</body></html>
