<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><title>Layer 1 · Unify</title></head>
<body>

  <path class="arrow" d="M374,153 L434,153"/>
  <path class="arrow" d="M374,335 L434,335"/>
  <path class="arrow" d="M374,501 L434,501"/>

  <rect class="t-sky" x="440" y="78" width="370" height="482" rx="14"/>
